name: Deploy BuildStock to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy main to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 18m
          script: |
            set -eu
            cd /var/www/stock

            echo "Checking tracked working-tree changes..."
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Deployment stopped: tracked local changes exist in /var/www/stock."
              git status --short
              exit 1
            fi

            git fetch origin main
            git merge --ff-only origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building production app..."
            npm run build

            echo "Reloading only the stock PM2 process..."
            pm2 reload stock --update-env
            pm2 save

            echo "Checking local HTTP response..."
            curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3001/

            echo "Deployment completed successfully."
