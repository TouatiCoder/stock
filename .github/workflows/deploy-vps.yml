name: Deploy BuildStock to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Add VPS secrets first, then set repository variable VPS_DEPLOY_ENABLED=true.
    # This prevents the first workflow commit from trying to deploy before setup.
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy main to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          command_timeout: 18m
          script: |
            set -eu
            cd /var/www/stock

            if [ -n "$(git status --porcelain)" ]; then
              echo "Deployment stopped: /var/www/stock has local changes. Commit/stash them before deploying."
              exit 1
            fi

            git fetch origin main
            git merge --ff-only origin/main

            npm ci
            npm run build

            pm2 reload stock --update-env
            pm2 save

            echo "Deployment completed. Verify http://2.24.139.220:3001/"
